[package]
name = "telegenic-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.telegenic]
path = ".."

[[bin]]
name = "gvcp"
path = "fuzz_targets/gvcp.rs"
test = false
doc = false
bench = false

